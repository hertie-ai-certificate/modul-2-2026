# Wahlumfrage 1936 der Zeitschrift Literary Digest

.pull-left[
## Hintergrund

- Die Wochenzeitschrift *Literary Digest* hatte die Präsidentschaftswahlen 1920 bis 1932 anhand ihrer Umfragen korrekt vorhergesagt.
- 1936 verschickte sie **10 Millionen Musterstimmzettel**, 2,4 Millionen kamen zurück. Ergebnis: deutlicher Sieg des Republikaners Alf Landon.

## Nachwehen

- Landon verlor erdrutschartig gegen Franklin D. Roosevelt, der 46 von 48 Bundesstaaten und 60,8% der Stimmen gewann.
- George Gallup sagte das Ergebnis mit einer Stichprobe von **50.000** Personen richtig voraus.
- Die Zeitschrift ging 1938 in Konkurs.
]

.pull-right[
&lt;div align="center"&gt;
&lt;img src="../pics/literary-digest-1.png" height=460&gt;
&lt;/div&gt;
]

# Wahlumfrage 1936 der Zeitschrift Literary Digest

.pull-left[
## Anatomie eines Debakels

1. **Stichprobenrahmen**: (1) eigene Leser, (2) registrierte Autobesitzer, (3) registrierte Telefonnutzer
2. **Datenerhebung**: Jeder bekam einen Musterstimmzettel zugeschickt und wurde gebeten, den markierten Stimmzettel zurückzugeben
3. **Rücklaufquote**: 2,4 Mio. von 10 Mio.

**Stichprobenverzerrung** als Folge von **coverage error** und **non-reponse**: Überrepräsentation von wohlhabenderen Personen mit einer Präferenz für Landon

.pull-right[
## Das Big-Data-Paradoxon

&gt; „Wenn verzerrte Stichproben groß sind, sind sie doppelt irreführend: Sie erzeugen Konfidenzintervalle mit falschen Mitteln und erheblich unterschätzter Unsicherheit. Dies ist das **Big-Data-Paradoxon**: Je umfangreicher die Daten sind, desto sicherer täuschen wir uns selbst, wenn wir die Verzerrungen bei der Datenerhebung nicht berücksichtigen.“

&lt;div align="right"&gt;Bradley et al. (2021), &lt;i&gt;Nature&lt;/i&gt;&lt;/div&gt;

&gt; „Die 'Größe' solcher Big Data (für Rückschlüsse auf die Population) sollte an der relativen Größe f = n/N der Stichprobe zur Population gemessen werden, nicht an der absoluten Größe n der Stichprobe.

&lt;div align="right"&gt;Xiao-Li Meng (2018), &lt;i&gt;The Annals of Applied Statistics&lt;/i&gt;&lt;/div&gt;
]

# Zensus 2022: Wer sind wir und wenn ja, wie viele?

.pull-left[
## Drei Zahlen, drei Verfahren

.font90[
Wo leben wie viele Menschen in Deutschland? An der Zahl hängen Länderfinanzausgleich, Wahlkreise, Schlüsselzuweisungen, Stimmen im Bundesrat.

- **Melderegister**: Jede Kommune führt ihr eigenes. Alle Register zusammen enthalten mehr Personen, als im Land leben: Wer ins Ausland zieht, meldet sich selten ab („Karteileichen“); wer zuzieht, nicht immer sofort („Fehlbestände“).
- **Fortschreibung**: Zensus 2011 plus Geburten, Sterbefälle, Zu- und Wegzüge aus den Meldungen. Zum Stichtag 2022: rund **84,1 Mio.**
- **Zensus 2022**: Registerabzug plus **Haushaltsstichprobe** (etwa jede zehnte Anschrift wird befragt). Aus der Stichprobe wird geschätzt, wie viele Registereinträge nicht stimmen, und das Register wird hochgerechnet korrigiert. Ergebnis: **82,7 Mio.**
]
]

.pull-right[
&lt;img src="d2s5-big-data-probleme_files/figure-html/zensus-chart-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
.font80[`Quellen` [Zensus 2022](https://www.zensus2022.de/); [Schnell, Lenz &amp; Schmidt (2026), Gutachten für 287 Gemeinden](https://duepublico2.uni-due.de/receive/duepublico_mods_00086443), Kap. 6 und 9.]
]

---
# Zensus 2022: Wer hat sich geirrt?

.pull-left[
## Die Vollerhebung

- Das Register ist groß, aber **systematisch** verzerrt: Abmeldungen fehlen vor allem bei Wegzügen ins Ausland, also bei Ausländern und in Großstädten. Köln: 7% unter dem eigenen Register.
- Der Fehler mittelt sich bei 85 Millionen Einträgen nicht weg. Das ist das Big-Data-Paradoxon: Größe täuscht Genauigkeit vor.

## Die Stichprobe

- Die Zensus-Schätzung korrigiert das Register, hat aber **eigene** Fehler: Hochrechnung in kleinen Gemeinden, Record Linkage bei der Dublettenprüfung, Interviewer-Effekte, Ausfälle. Ihre Fehlermargen hat Destatis nach Ansicht der Gutachter unterschätzt.
]

.pull-right[
## Fazit

- **Man weiß es nicht genau.** Es gibt keinen dritten, unabhängigen Maßstab. Deshalb haben 287 Gemeinden ein Gutachten beauftragt, und mehrere Hundert Widerspruch eingelegt.
- Sicher ist nur: Die Vollerhebung allein irrt systematisch, die Stichprobe allein kann nicht alles sehen.
- Für jede Analyse mit Registerdaten stellt sich die Frage: **Wer ist drin, wer ist noch drin, wer war nie drin?**

.font80[`Quelle` [Schnell, Lenz &amp; Schmidt (2026): Eine methodische Kritik des Zensus 2022](https://duepublico2.uni-due.de/receive/duepublico_mods_00086443), Kap. 3.1, 8, 9.5, 10]
]

# Eine Heuristik für alle Datenfehler: Total Survey Error

.pull-left[
## Zwei grundsätzliche Fehlerquellen bei jeder Datensammlung

- **Messfehler**: was man misst, ist nicht das, was man messen will
- Fehler der **Repräsentation**: Die Gruppe, die Ihr beobachtet, ist nicht verallgemeinerbar auf die interessierende Population

## Nicht nur für Umfragen

- Entwickelt für Befragungen, aber die Logik gilt für **jede** Datenquelle: Register, Fachverfahren, Sensoren, Logdaten, Trainingsdaten.
- Linke Seite: **Messung** (Konzept, Erfassung, Verarbeitung). Rechte Seite: **Repräsentation** (Zielgruppe, Datenrahmen, Ausfälle).
]

# Stichproben und Repräsentativität

.pull-left[
## Eine substantielle Definition von Repräsentativität

Eine Stichprobe (oder Daten im Allgemeinen) ist „repräsentativ“, wenn **die aus der Stichprobe gezogenen Schlüsse verallgemeinert werden können** auf die Grundgesamtheit von Interesse.
]

.pull-right[
## Eine formalere Definition

Eine Stichprobe ist repräsentativ, wenn sie so gezogen wird, dass sie **statistisch nicht von der interessierenden Grundgesamtheit** unterscheidbar ist.
]

&lt;div align="center"&gt;
&lt;img src="../pics/samples.png" height=300&gt;
&lt;/div&gt;

---
# Das Problem mit der „Repräsentativität“

## Warum „Repräsentativität“ ein problematischer Begriff ist

1. Ob eine Stichprobe repräsentativ ist, hängt von Eurem Interesse ab.
2. Man kann eine Stichprobe nicht a priori als „repräsentativ“ bezeichnen. 
3. Die Beurteilung der Repräsentativität einer Stichprobe erfordert starke Annahmen über Euer Wissen über die Grundgesamtheit und Eure Messungen der Merkmale, die „repräsentativ“ sein sollten.

--

.pull-left[

&lt;br&gt;
## Ein Beispiel

- Ihr führt eine Umfrage zur Wahlabsicht durch.
- Wen möchtet Ihr repräsentieren? Die Wahlbevölkerung oder die Gesamtbevölkerung?
- Wie erreicht Ihr eine repräsentative Stichprobe? Zufallsauswahl? Gewichtung?

]

# Mess- und Stichprobenfehler in freier Wildbahn

.pull-left[
## Überrepräsentation und falsche Angaben in Wahlumfragen

- Umfragestatistiken überschätzen die Wahlbeteiligung oft erheblich. 
- Zwei unterschiedliche Phänomene sind für diese Diskrepanz verantwortlich:
    1. Überrepräsentation der tatsächlichen Wähler
    2. Falsche Angaben zur Wahlbeteiligung durch Nichtwähler unter den Umfrageteilnehmern. 
- Studien zur Validierung der Wahlbeteiligung helfen, das Problem auf individueller Ebene zu identifizieren.
- Eine Verzerrung der Wahlbeteiligung kann sich auch auf Analysen nachgelagerter Variablen (z.B. Wahlverhalten) auswirken.

# Selektion in Verwaltungsdaten I: Wer stellt keinen Antrag?

.pull-left[
&lt;div align="center"&gt;
&lt;img src="../pics/diw-grundsicherung.png" width=450&gt;
&lt;/div&gt;

## Der Fall

- **Grundsicherung im Alter** steht allen zu, deren Rente unter dem Existenzminimum liegt.
- Die Statistik kennt nur, wer sie **beantragt** hat.
- Das DIW schätzt mit dem SOEP: rund **60% der Berechtigten** stellen keinen Antrag.
- Gründe: Unkenntnis, Aufwand, Scham. Alles hängt mit Alter, Bildung und Gesundheit zusammen, die Lücke ist also **nicht zufällig**.
]

.pull-right[
## Folgen

- Die ausgewiesene Quote liegt bei 2,8%; bei voller Inanspruchnahme wären es **7,4%**.
- Bedarfsplanung und Armutsberichte auf Basis der Leistungsdaten **unterschätzen** das Problem.
- Ein KI-System, trainiert auf Antragsdaten, lernt die Antragsteller kennen, nicht die Berechtigten.

## Ähnliche Muster

- Wohngeld, Kinderzuschlag, Bildungs- und Teilhabepaket, Beratungsangebote: **Nichtinanspruchnahme ist unsichtbar**, solange man nur die eigenen Daten anschaut.

.font80[`Quelle` [Buslei et al. (2019), DIW Wochenbericht 49](https://www.diw.de/de/diw_01.c.699957.de/publikationen/wochenberichte/2019_49_1/starke_nichtinanspruchnahme_von_grundsicherung_deutet_auf_hohe_verdeckte_altersarmut.html), Daten 2010 bis 2015]

]

# Selektion in Verwaltungsdaten II: Hellfeld und Dunkelfeld

.pull-left[
## Der Fall

- Die **Polizeiliche Kriminalstatistik (PKS)** zählt, was angezeigt oder von der Polizei festgestellt wurde: das **Hellfeld**.
- Die Dunkelfeldstudie **SKiD** des BKA (46.000 Befragte, 2020) zeigt, wie selektiv das ist und wie das Anzeigeverhalten von Delikt zu Delikt variiert.

## Das Selektionsproblem

- Ein Anstieg in der PKS kann bedeuten: mehr Kriminalität, mehr Anzeigen, mehr Kontrollen oder eine neue Erfassungsregel.
- **Predictive Policing** wird auf dem Hellfeld trainiert: Wo bisher viel kontrolliert und angezeigt wurde, sagt das Modell mehr voraus, dorthin geht mehr Polizei, dort wird mehr festgestellt. Die Selektion **verstärkt sich selbst**.
]

.pull-right[
&lt;img src="d2s5-big-data-probleme_files/figure-html/hellfeld-chart-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
.font80[`Quellen` [BKA, Pressemitteilung zu SKiD 2020](https://www.bka.de/DE/Presse/Listenseite_Pressemitteilungen/2022/Presse2022/221108_PM_SKiD.html); [SKiD-Dashboard](https://skid.bka.de/Wichtige_Ergebnisse.html); [SKiD NRW](https://polizei.nrw/sites/default/files/2022-11/SKiD%202020%20-%20Erste%20Ergebnisse%20f%C3%BCr%20Nordrhein-Westfalen.pdf). Werte gerundet.]

## Ähnliche Muster

- Beschwerdestatistiken, Meldungen an Ordnungsämter, Verkehrsunfälle (nur polizeilich erfasste).
- Dunkelfeldstudien können helfen.
]

# Schlechte Stichproben: lessons learned


.pull-left[
## Was bedeutet das für Euch?

- Nehmt die angegebene „Repräsentativität“ nicht für bare Münze.
- Der Stichprobenumfang allein garantiert keine Repräsentativität (siehe Big Data!). Lasst Euch also nicht von „großen Datenmengen“ täuschen (nicht per se repräsentativ).
- Schlechte Stichproben sind nicht auf Erhebungen beschränkt: Melderegister (wer sich nicht abmeldet), Leistungsdaten (wer nicht beantragt), Kriminalstatistik (wer nicht anzeigt), Social-Media-Daten (wer dort schreibt), Sensoren (wo sie stehen).
]

.pull-right[
## Achtet stattdessen auf: 

1. **Transparenz** über das Auswahlverfahren.
2. **Validierung** der Stichprobe anhand externer Benchmarks.
4. **Euren gesunden Menschenverstand**: Ist die Datengrundlage systematisch verzerrt, d.h. auf relevanten Kriterien unterschiedlich von der Grundgesamtheit?
]

# Messung und AI-Anwendungen

.pull-left[
## Messung ist ein zentraler Bestandteil von AI-Anwendungen

- AI-Modelle lernen von Daten, die gemessen werden.
- Gleichzeitig können AI-Modelle auch messen (z. B. Gesichtserkennung, Spracherkennung).

✎ Messung ist gleichzeitig Grundlage (Input) für als auch Output von AI-Anwendungen.

## Messfehler in AI-Anwendungen

- Messfehler können systematisch sein (z. B. durch soziale Erwünschtheit).
- Messfehler können zufällig sein (z. B. durch technische Probleme).
- Messfehler können auch durch die AI-Anwendung selbst entstehen (z. B. durch schlechte Datenqualität).
]

# Messung in Verwaltungsdaten: Sprachbiometrie beim BAMF

.pull-left[
## Der Fall

- Seit 2017 setzt das Bundesamt für Migration und Flüchtlinge eine Software ein, die aus einer **zweiminütigen Sprachprobe** die wahrscheinliche Herkunftsregion von Asylsuchenden ohne Papiere schätzt.
- Gemessen werden **Aussprache und Dialektmerkmale**; ausgegeben werden Wahrscheinlichkeiten für Dialekte. Das BAMF nennt das ein „Indiz“, keinen Beweis.
- Fehlerquote nach BAMF-Angaben **15 bis 20%**; eine unabhängige Evaluation, 2018 angekündigt, liegt bis heute nicht vor.
]

]

# Gut funktionierende Messung: Gesichtserkennung

.pull-left[
## Messung von Gesichtsmerkmalen

# Datenqualität sichern
&lt;html&gt;&lt;div style='float:left'&gt;&lt;/div&gt;&lt;hr color='#EB811B' size=1px style="width:1000px; margin:auto;"/&gt;&lt;/html&gt;

# Garbage in, Garbage out

.pull-left[
## Das GIGO Prinzip
- Die Qualität der Informationen, die ein Modell produziert (z.B. Vorhersagen), kann nicht besser sein als die Qualität der Informationen, die in das Modell eingespeist werden.
- Dieser Grundsatz ist wird umso relevanter in Big-Data-Kontexten, wenn Daten unzureichend validiert oder Datenqualität schlicht nicht gegeben ist.
- Das Problem verschärft sich potentiell in ML-Anwendungen, wenn Modelle komplex und intransparent sind.
]

.pull-right[
&lt;div align="center"&gt;&lt;br&gt;&lt;br&gt;
&lt;img src="../pics/gigo.png" width=480&gt;
&lt;/div&gt;
]

---
# Garbage in, Garbage out: Lessons learned

.pull-left[
1. **Messung-** und **Selektions-Fragen** sind bei der Big-Data-Analyse nach wie vor entscheidend.

2. Traut **Messungen** nicht, die nicht **richtig validiert** wurden.

3. Achtet darauf, was in ein Modell einfließt (der **Input**: Fälle, Variablen/Merkmale).

4. Achtet auf eine angemessene **Out-of-Sample-Validierung** von Modellen.

5. Vorsicht bei **unkritischer Nutzung von Online-/Sozialen Medien** und von **Verfahrensdaten** als Datenquelle: Beide beschreiben, wer sich gemeldet hat, nicht die Welt.
]

# Umgang mit Evidenz als Detektivarbeit

.pull-left-wide[
## Der Ansatz

- Auswertung von Daten ist wie Detektivarbeit
- Wir müssen die **Evidenz genau unter die Lupe nehmen**, um herauszufinden, ob der Verdächtige - der vermutete Zusammenhang, der deskriptive Befund - tatsächlich hält, was er verspricht
- Dazu müssen wir versuchen **Alternativerklärungen auszuschließen**

## Die Ausstattung

- **Unsere Toolbox:** Kritisches Denken, Beobachtung (Datenerhebung), Wahrnehmung (Messung), externes Wissen, statistische Methoden
- Ohne qualitative Beurteilung sind die quantitativen Werkzeuge häufig ohne Wert
]

# Lösung des Falles

.pull-left-wide[

|                       	| Evidenz und Schlüsse                           	|
|-----------------------	|----------------------------------------------------	|
| **Der Tatort**   	| Gesichter sagen Straftäter vorher                 	|
| **Die Verdächtigen**    	| Lifestyle, Physiognomik |
| **Die Tatwaffe** 	| Konfundierung in Datenerhebung (biased training set)                    	|

&gt; "Extraordinary claims require extraordinary evidence. The authors of this paper make the extraordinary claim that facial structure reveals criminal tendencies. We have argued that, given all publicly available information, their findings can be explained by a much more reasonable hypothesis: non-criminals are more likely to be smiling in photos chosen for publicity purposes than are criminals in the ID photos (not mugshots) chosen by police departments for wanted posters and other purposes. Notice that we did all of this without digging into the details of the machine learning algorithms at all. We didn’t need to. We know that a machine learning algorithm is only as good as its training data, and we can see that the training set used here is fundamentally flawed for the purpose it is used." &lt;div align="right"&gt;Carl Bergstrom and Jevin West, &lt;a href="https://callingbullshit.org/case_studies/case_study_criminal_machine_learning.html"&gt;Calling Bullshit&lt;/a&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/div&gt;
